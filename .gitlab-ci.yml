variables:
  USR: root
  GIT_SUBMODULE_STRATEGY: recursive
  REMOTE_PATH: /usr/local/share/bot2

.only_master: &only_master
  only:
    - master

stages:
  - install
  - deploy

build_composer:
  <<: *only_master
  stage: install
  image: composer:2
  tags:
    - docker
  cache:
    key: "composer-${CI_COMMIT_REF_SLUG}"
    paths:
      - src/vendor/
  script:
    - cd src/
    - export http_proxy="$http_proxy"
    - export https_proxy="$http_proxy"
    - export COMPOSER_AUTH="{\"http-basic\":{\"gitlab.novotelecom.ru\":{\"username\":\"$LIBS_USER\",\"password\":\"$LIBS_PASS\"}}}"
    - /usr/bin/composer config repositories.libs '{"type":"vcs","url":"https://gitlab.novotelecom.ru/laravel-libs/libs.git","no-api":true}'
    - composer -V
    - composer install --no-dev --optimize-autoloader --ignore-platform-reqs
  artifacts:
    paths:
      - src/vendor/
    expire_in: 1 hour

.deploy_template: &deploy_definition
  <<: *only_master
  stage: deploy
  tags:
    - docker
  script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$DEPLOYKEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $SERV >> ~/.ssh/known_hosts

    - ssh $USR@$SERV "sudo mkdir -p $REMOTE_PATH && sudo chown $USR:www-data $REMOTE_PATH"

    # rsync с учетом собранного vendor
    - rsync -avz --delete --exclude='.git/' --exclude='node_modules/' --exclude='storage/*.key' src/ $USR@$SERV:$REMOTE_PATH/

    - >
      ssh $USR@$SERV "
        cd $REMOTE_PATH &&
        php artisan optimize:clear &&
        php artisan config:cache &&
        php artisan route:cache &&
        php artisan migrate --force &&
        php artisan queue:restart &&
        sudo chown -R www-data:www-data storage bootstrap/cache &&
        sudo supervisorctl restart all
      "

deploy_server_01:
  <<: *deploy_definition
  variables:
    SERV: tgzabbix-01.novotelecom.ru

deploy_server_02:
  <<: *deploy_definition
  variables:
    SERV: tgzabbix-02.novotelecom.ru
